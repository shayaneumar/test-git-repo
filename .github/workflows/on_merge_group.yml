# This workflow runs on PR target
name: Merge Group

# Controls when the action will run.
on:
  # Trigger workflow for merge group
  merge_group:
    types:
      - checks_requested

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}

# Cancel running workflows (this replaces the old cancel-workflow.yml script)
concurrency:
  group: on_merge_group-group
  cancel-in-progress: true

jobs:
  lint-code:
    name: "▶️ actions"
    uses: ./.github/workflows/lint-code.yml
    secrets:
      depotTokenReadOnly: ${{ secrets.depotTokenReadOnly }}

  build-code:
    name: "▶️ actions"
    needs:
      - lint-code
    uses: ./.github/workflows/build-code.yml
    secrets:
      depotTokenReadOnly: ${{ secrets.depotTokenReadOnly }}

  unit-tests:
    name: "▶️ actions"
    needs:
      - build-code
    uses: ./.github/workflows/unit-tests.yml
    secrets:
      depotTokenReadOnly: ${{ secrets.depotTokenReadOnly }}
